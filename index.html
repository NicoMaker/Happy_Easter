<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Easter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene">
      <div class="tree-container">
        <div class="tree">
          <div class="star">🌸</div>
          <div class="tree-layer layer1" id="layer1"></div>
          <div class="tree-layer layer2" id="layer2"></div>
          <div class="tree-layer layer3" id="layer3"></div>
          <div class="tree-layer layer4" id="layer4"></div>
          <div class="trunk"></div>
        </div>

        <div class="message">Happy Easter</div>
      </div>

      <div class="santa-container">
        <span class="reindeer-group">🐣🐣🐣</span>
        <span class="sleigh">🥚</span>
        <span class="santa">🐰</span>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
